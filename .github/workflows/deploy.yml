name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Relance manuelle (ou via API) sans commit — un re-run du job échoue avec
  # "Multiple artifacts named github-pages", il faut un run neuf.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp public-site/index.html _site/index.html
          cp public-site/index.html _site/404.html
          cp public-site/logo.png _site/logo.png 2>/dev/null || true
          # Pages légales : servies en /privacy et /terms grâce au index.html
          # de chaque dossier. Enable Banking contrôle ces liens lors de la
          # validation d'une application en production.
          cp -r public-site/privacy _site/privacy
          cp -r public-site/terms _site/terms
          echo "wbpartners.fr" > _site/CNAME
          cp -r dist/app/* _site/app/
          cp _site/app/index.html _site/app/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # File de publication Pages parfois lente (06/08/2026 : >10 min en
          # deployment_queued) — on attend jusqu'à 30 min avant d'abandonner.
          timeout: 1800000
